name: .NET CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17 (required for Sonar scanner)
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install dotnet-sonarscanner
        id: install-sonar-scanner
        run: |
          dotnet tool update dotnet-sonarscanner --tool-path $RUNNER_TEMP/scanner || dotnet tool install dotnet-sonarscanner --tool-path $RUNNER_TEMP/scanner
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"

      - name: SonarCloud - begin analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        run: |
          $RUNNER_TEMP/scanner/dotnet-sonarscanner begin /k:"Kristof30001_verval3" /o:"kristof30001" /d:sonar.host.url="https://sonarcloud.io" /d:sonar.token="$SONAR_TOKEN" /d:sonar.cs.opencover.reportsPaths="**/coverage/*.opencover.xml"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore VerVal.sln

      - name: Build
        run: dotnet build VerVal.sln --no-restore --configuration Debug

      - name: Test and collect coverage
        run: dotnet test VerVal.sln --no-build --configuration Debug --verbosity normal /p:CollectCoverage=true /p:CoverletOutput=./coverage/ /p:CoverletOutputFormat=opencover

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generate HTML Report
        run: reportgenerator -reports:./coverage/*.opencover.xml -targetdir:./coveragereport -reporttypes:Html

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coveragereport/

      - name: SonarCloud - end analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        run: |
          $RUNNER_TEMP/scanner/dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"
