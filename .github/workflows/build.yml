name: .NET CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (required for Sonar scanner)
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install dotnet-sonarscanner
        id: install-sonar-scanner
        run: |
          dotnet tool update dotnet-sonarscanner --tool-path $RUNNER_TEMP/scanner || dotnet tool install dotnet-sonarscanner --tool-path $RUNNER_TEMP/scanner
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"

      - name: SonarCloud - begin analysis
        if: ${{ secrets.SONAR_TOKEN }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          $RUNNER_TEMP/scanner/dotnet-sonarscanner begin /k:"Kristof30001_verval3" /o:"kristof30001" /d:sonar.host.url="https://sonarcloud.io" /d:sonar.login="${{ secrets.SONAR_TOKEN }}"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore VerVal.sln

      - name: Build
        run: dotnet build VerVal.sln --no-restore --configuration Debug

      - name: Test and collect coverage
        run: dotnet test VerVal.sln --no-build --configuration Debug --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generate HTML Report
        run: reportgenerator -reports:./coverage/**/*.cobertura.xml -targetdir:./coveragereport -reporttypes:Html

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coveragereport/

      - name: SonarCloud - end analysis
        if: ${{ secrets.SONAR_TOKEN }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          $RUNNER_TEMP/scanner/dotnet-sonarscanner end /d:sonar.login="${{ secrets.SONAR_TOKEN }}"
